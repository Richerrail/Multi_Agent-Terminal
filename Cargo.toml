[package]
name = "multi_agent_terminal"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", features = ["json"] }
chrono = { version = "0.4", features = ["clock"] }
dialoguer = "0.10"
crossterm = "0.27"
ratatui = "0.26"
